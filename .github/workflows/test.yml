name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Build frontend assets (required by go:embed)
        run: |
          pnpm install
          pnpm --dir frontend build

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build whisper.cpp libs
        run: ./scripts/build-whisper.sh

      - name: Download CI whisper model
        run: |
          mkdir -p "$HOME/.cache/interagent-test"
          curl -L --fail https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin -o "$HOME/.cache/interagent-test/ggml-tiny.bin"
          curl -L --fail https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin -o "$HOME/.cache/interagent-test/ggml-silero-v6.2.0.bin"
          echo "INTERAGENT_WHISPER_MODEL=$HOME/.cache/interagent-test/ggml-tiny.bin" >> "$GITHUB_ENV"
          echo "INTERAGENT_VAD_MODEL=$HOME/.cache/interagent-test/ggml-silero-v6.2.0.bin" >> "$GITHUB_ENV"

      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code -- '*.go'

      - name: Run go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...

  go-linux:
    name: Go tests (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install audio dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev libpipewire-0.3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Build frontend assets (required by go:embed)
        run: |
          pnpm install
          pnpm --dir frontend build

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build whisper.cpp libs
        run: ./scripts/build-whisper.sh

      - name: Download CI whisper model
        run: |
          mkdir -p "$HOME/.cache/interagent-test"
          curl -L --fail https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin -o "$HOME/.cache/interagent-test/ggml-tiny.bin"
          curl -L --fail https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin -o "$HOME/.cache/interagent-test/ggml-silero-v6.2.0.bin"
          echo "INTERAGENT_WHISPER_MODEL=$HOME/.cache/interagent-test/ggml-tiny.bin" >> "$GITHUB_ENV"
          echo "INTERAGENT_VAD_MODEL=$HOME/.cache/interagent-test/ggml-silero-v6.2.0.bin" >> "$GITHUB_ENV"

      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code -- '*.go'

      - name: Run go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...

  frontend:
    name: Frontend tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Check docs formatting
        working-directory: .
        run: pnpm docs:format:check

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run unit tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Run e2e tests
        run: pnpm exec playwright test
